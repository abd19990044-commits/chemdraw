name: Quantum input bot tests

on:
  push:
    paths:
      - "app.py"
      - "geometry_normalizer.py"
      - "gaussian_input.py"
      - "quantum_validation.py"
      - "quantum_input_extension.py"
      - "legacy_app.py"
      - "bounded_state_cache.py"
      - "test_state_cache_bounds.py"
      - "tests/**"
      - "requirements.txt"
      - "gaussview_linux.py"
      - "gaussian_input.py"
      - "gaussian_advanced.py"
      - "gaussian_catalog.py"
      - "tests/test_gaussian_extended.py"
      - "tests/test_gaussview_linux.py"
      - "psi4_extension*.py"
      - "tests/test_quantum_input_extension.py"
      - "tests/test_geometry_normalizer.py"
      - "tests/test_psi4*.py"
      - "requirements.txt"
      - ".github/workflows/quantum-input-tests.yml"
  pull_request:
    paths:
      - "app.py"
      - "geometry_normalizer.py"
      - "gaussian_input.py"
      - "quantum_validation.py"
      - "quantum_input_extension.py"
      - "gaussview_linux.py"
      - "tests/test_gaussview_linux.py"
      - "psi4_extension*.py"
      - "tests/test_quantum_input_extension.py"
      - "tests/test_geometry_normalizer.py"
      - "tests/test_psi4*.py"
      - "requirements.txt"
      - ".github/workflows/quantum-input-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
