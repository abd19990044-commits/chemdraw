name: Publication Renderer Tests

on:
  push:
    branches:
      - feature/publication-reaction-renderer
  pull_request:
    paths:
      - 'publication_renderer.py'
      - 'publication_entry.py'
      - 'tests/test_publication_renderer.py'
      - '.github/workflows/publication-renderer-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check
        run: |
          python -m py_compile publication_renderer.py publication_entry.py app.py

      - name: Run regression suite
        run: pytest -q tests/test_publication_renderer.py
