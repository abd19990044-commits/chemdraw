name: Chemistry Publication Bot Tests

on:
  push:
    branches:
      - main
      - feature/publication-reaction-renderer
    paths:
      - 'app.py'
      - 'publication_renderer*.py'
      - 'publication_entry*.py'
      - 'reaction_balancer.py'
      - 'advanced_chemistry*.py'
      - 'chemistry_ui.py'
      - 'render_capacity.py'
      - 'rxn_export.py'
      - 'cdxml_export.py'
      - 'single_compound_pipeline.py'
      - 'tests/**'
      - '.github/workflows/publication-renderer-tests.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'publication_renderer*.py'
      - 'publication_entry*.py'
      - 'reaction_balancer.py'
      - 'advanced_chemistry*.py'
      - 'chemistry_ui.py'
      - 'render_capacity.py'
      - 'rxn_export.py'
      - 'cdxml_export.py'
      - 'single_compound_pipeline.py'
      - 'tests/**'
      - '.github/workflows/publication-renderer-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check production modules
        run: |
          python -m py_compile \
            app.py legacy_app.py \
            publication_renderer.py publication_renderer_v2.py publication_renderer_v3.py \
            publication_entry.py publication_entry_balanced.py publication_entry_advanced.py \
            reaction_balancer.py advanced_chemistry.py advanced_chemistry_v2.py \
            chemistry_ui.py render_capacity.py rxn_export.py cdxml_export.py single_compound_pipeline.py

      - name: Run regression suite
        run: pytest -q tests
